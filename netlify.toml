[build]
  publish = "."

[[redirects]]
  from = "https://www.naderabsy.com/*"
  to = "https://naderabsy.com/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    # Force HTTPS for 2 years, including subdomains, and allow preloading
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    # Stop browsers guessing content types
    X-Content-Type-Options = "nosniff"
    # Block framing (clickjacking); frame-ancestors is the modern equivalent
    X-Frame-Options = "DENY"
    # Don't leak full URLs to other sites
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Deny access to device APIs this site never uses
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    # Limit cross-origin resource sharing of this document
    Cross-Origin-Opener-Policy = "same-origin"
    # Inline scripts are allowed by hash, not 'unsafe-inline', so an injected <script> can't run.
    # The two hashes are the theme bootstrap and the Clarity loader in index.html; if either
    # script's text changes by even a byte, recompute its hash or it will be blocked:
    #   python3 -c "import hashlib,base64,sys;print(base64.b64encode(hashlib.sha256(sys.stdin.read().encode()).digest()).decode())"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-MImpG0/o6JDrl/FAMBSMgCO8xCxVu9LsXWS7k3uby9c=' 'sha256-/rPqCYyQuDjwKPs9/Ld7dufr3Kw58NRgwBFTZlqKu4g=' https://www.clarity.ms https://scripts.clarity.ms; script-src-attr 'none'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://*.clarity.ms; connect-src 'self' https://*.clarity.ms; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/resume.pdf"
  [headers.values]
    Cache-Control = "public, max-age=3600"
