[build]
  publish = "."

[[redirects]]
  from = "https://www.naderabsy.com/*"
  to = "https://naderabsy.com/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    # Force HTTPS for 2 years, including subdomains, and allow preloading
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    # Stop browsers guessing content types
    X-Content-Type-Options = "nosniff"
    # Block framing (clickjacking); frame-ancestors is the modern equivalent
    X-Frame-Options = "DENY"
    # Don't leak full URLs to other sites
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Deny access to device APIs this site never uses
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    # Limit cross-origin resource sharing of this document
    Cross-Origin-Opener-Policy = "same-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.clarity.ms https://scripts.clarity.ms; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://*.clarity.ms; connect-src 'self' https://*.clarity.ms; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/resume.pdf"
  [headers.values]
    Cache-Control = "public, max-age=3600"
